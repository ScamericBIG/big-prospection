name: Dallage (base et veille Nouvelle-Aquitaine)

on:
  workflow_dispatch:
    inputs:
      quoi:
        description: "veille = appels d'offres et actualités ; base = projets (permis) et acteurs ; tout = les deux"
        type: choice
        options: [tout, veille, base]
        default: tout
  schedule:
    - cron: "13 5 * * *"    # veille chaque matin
    - cron: "37 2 3 * *"    # base chaque mois (nouveaux permis de construire publiés mensuellement)

jobs:
  veille:
    if: github.event_name == 'workflow_dispatch' && inputs.quoi != 'base' || github.event.schedule == '13 5 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev
      - name: Veille Dallage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/veille.mjs --pole dallage
  base:
    if: github.event_name == 'workflow_dispatch' && inputs.quoi != 'veille' || github.event.schedule == '37 2 3 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Import projets et acteurs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SURFACE_MIN: "500"
        run: node scripts/import-dallage.mjs
